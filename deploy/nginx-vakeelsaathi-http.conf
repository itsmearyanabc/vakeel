# =============================================================================
# vakeelsaathi.in — pre-TLS vhost
#
# Plain HTTP on purpose. `certbot --nginx` adds the 443 server block and the
# certificate paths itself, which is safer than hand-writing them on a host
# where Certbot already manages another site (intern.armedias.com).
#
#   cp deploy/nginx-vakeelsaathi-http.conf /etc/nginx/sites-available/vakeelsaathi.in
#   ln -sf /etc/nginx/sites-available/vakeelsaathi.in /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Note the absence of `default_server`: this block is matched by server_name, so
# the existing catch-all keeps serving everything else exactly as it does now.
# =============================================================================

upstream vakeel_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name vakeelsaathi.in www.vakeelsaathi.in;

    # Meta's webhook posts small JSON. Nothing here legitimately uploads
    # anything large, and a low cap limits the blast radius of a hostile POST.
    client_max_body_size 2m;

    # Scoped so this application's traffic does not mix with the other sites on
    # this host - theirs stay readable, ours can be rotated independently.
    access_log /var/log/nginx/vakeelsaathi.access.log;
    error_log  /var/log/nginx/vakeelsaathi.error.log;

    # -------------------------------------------------------------------------
    # The chat stream.
    #
    # `proxy_buffering off` is the entire reason this location exists. nginx
    # buffers upstream responses by default, which holds every server-sent event
    # until the response completes - turning live progress into one delivery at
    # the end, and looking exactly like the application hanging.
    #
    # gzip is off here for the same reason: a compressing filter buffers to fill
    # its window, undoing the setting above.
    # -------------------------------------------------------------------------
    location = /api/chat/ask {
        proxy_pass http://vakeel_web;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;

        # A long answer must not be cut mid-flight. The application also sends a
        # heartbeat comment every 15s, so an idle stream is never really idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Empty Connection header keeps the upstream connection alive rather
        # than sending "close", which would defeat the keepalive pool above.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Meta's webhook.
    #
    # The signature is an HMAC over the exact bytes received, so nothing may
    # rewrite the body. Separated so that a compression or rewrite directive
    # added later to the general location cannot silently break verification -
    # a failure that presents as "the bot stopped replying", with a 401 nobody
    # is watching for.
    # -------------------------------------------------------------------------
    location /webhooks/ {
        proxy_pass http://vakeel_web;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Meta expects a fast acknowledgement and throttles subscriptions that
        # are slow. The app enqueues and returns well inside this; the ceiling
        # only catches a pathological case.
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://vakeel_web;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # An answer is a model call; the 60s default is not always enough.
        proxy_read_timeout 120s;
    }
}
