# =============================================================================
# vakeelsaathi.in — nginx vhost
#
# Use this file if nginx is ALREADY serving something else on this box. Adding a
# server block is additive; installing Caddy alongside a running nginx is not,
# because both want ports 80 and 443 and the loser fails to start. On a host
# with other people's production apps, that is the difference between a deploy
# and an outage.
#
#   sudo cp deploy/nginx-vakeelsaathi.conf /etc/nginx/sites-available/vakeelsaathi.in
#   sudo ln -s /etc/nginx/sites-available/vakeelsaathi.in /etc/nginx/sites-enabled/
#   sudo nginx -t          # MUST pass before reloading — see below
#   sudo systemctl reload nginx
#
# `nginx -t` is not optional here. `reload` on a broken config leaves the old
# one running, but `restart` does not, and a typo would take every other site on
# this box down with it.
# =============================================================================

# -----------------------------------------------------------------------------
# Cloudflare sends the visitor's address in CF-Connecting-IP; without this every
# request appears to originate from Cloudflare.
#
# That is not cosmetic. The application rate-limits sign-ins per IP, so with all
# traffic sharing one apparent address, twenty failed logins from anywhere on
# the internet would lock out every advocate at once. It also makes the
# signed-in device list meaningless.
#
# Ranges from https://www.cloudflare.com/ips/ — they change rarely; check yearly.
# -----------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream vakeel_web {
    # Must match PORT in .env.
    server 127.0.0.1:3001;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# Port 80 exists only to redirect.
#
# Cloudflare is configured with "Always Use HTTPS", so in practice almost
# nothing arrives here — but a request that reaches the origin directly on port
# 80 (someone who resolved the IP, or a misconfigured DNS record) must not be
# served in the clear.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vakeelsaathi.in www.vakeelsaathi.in;
    return 301 https://vakeelsaathi.in$request_uri;
}

# www -> apex, so there is one canonical origin. Two hostnames serving the same
# app would mean session cookies that do not follow the user between them.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vakeelsaathi.in;

    ssl_certificate     /etc/ssl/cloudflare/vakeelsaathi.in.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vakeelsaathi.in.key;

    return 301 https://vakeelsaathi.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vakeelsaathi.in;

    # Cloudflare Origin Certificate. Free, valid 15 years, and trusted by
    # Cloudflare specifically — which is all that is needed, because nothing but
    # Cloudflare should ever connect here. See deploy/cloudflare.md for how to
    # generate it, and why SSL mode must be Full (strict) rather than Flexible.
    ssl_certificate     /etc/ssl/cloudflare/vakeelsaathi.in.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vakeelsaathi.in.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_vakeel:10m;
    ssl_session_timeout 1d;

    # Meta's webhook posts JSON; nothing here legitimately uploads anything
    # large. A low cap limits the blast radius of a hostile POST.
    client_max_body_size 2m;

    # Logs scoped to this site so they do not mix with the other apps on this
    # host — theirs stay readable, and ours can be rotated independently.
    access_log /var/log/nginx/vakeelsaathi.access.log;
    error_log  /var/log/nginx/vakeelsaathi.error.log;

    # HSTS. Only safe once HTTPS is known to work; if the certificate ever
    # breaks, browsers will refuse to fall back for the whole max-age. Start
    # with a short max-age and raise it after a week of clean running.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # -------------------------------------------------------------------------
    # The chat stream.
    #
    # This location exists because of `proxy_buffering off`. nginx buffers
    # upstream responses by default, which holds every server-sent event until
    # the response completes — turning a live progress stream into one delivery
    # at the end, and looking exactly like the application is hanging.
    #
    # The read timeout matters too: the default 60s would cut a long answer
    # mid-flight. The application also sends a heartbeat comment every 15s, so
    # an idle stream is never actually idle.
    # -------------------------------------------------------------------------
    location = /api/chat/ask {
        proxy_pass http://vakeel_web;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        # Disables gzip for this response. A compressing filter would buffer to
        # fill its window, undoing proxy_buffering off.
        gzip off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Empty Connection header keeps the upstream connection alive rather
        # than sending "close", which would defeat the keepalive pool.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Meta's webhook.
    #
    # The signature is an HMAC over the exact bytes received, so nothing may
    # rewrite the body. nginx does not modify request bodies, but this is
    # separated so that a future `sub_filter` or compression setting added to
    # the general location cannot silently break signature verification — a
    # failure that presents as "the bot stopped replying" with a 401 nobody
    # is watching for.
    # -------------------------------------------------------------------------
    location /webhooks/ {
        proxy_pass http://vakeel_web;
        proxy_http_version 1.1;
        proxy_request_buffering on;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Meta expects a fast acknowledgement and throttles subscriptions that
        # are slow. The app enqueues and returns in well under a second; this
        # ceiling only catches a pathological case.
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://vakeel_web;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # Generous: an answer is a model call, and 60s is not always enough.
        proxy_read_timeout 120s;
    }
}
