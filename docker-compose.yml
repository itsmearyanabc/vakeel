# Local development environment.
#
# Postgres here is only a stand-in so you can develop without touching your
# Supabase project. It ships pgvector so the migrations in supabase/migrations
# apply cleanly. Point DATABASE_URL at Supabase when you want the real thing.
#
# The port is deliberately NOT the default (5433 instead of 5432) so this
# project cannot collide with another Postgres you already run locally. The
# project name, container names and volumes are all prefixed too, so
# `docker compose down -v` here touches nothing else.
#
# There is no Redis service. There was, and migration 0013 removed the need for
# it: the job queue, the caches, the distributed locks and the rate limiters all
# moved into Postgres. Leaving the container defined meant every developer ran
# an empty Redis, and left `REDIS_URL` looking like configuration that mattered.

name: vakeel-saathi

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vakeel-postgres
    environment:
      POSTGRES_USER: vakeel
      POSTGRES_PASSWORD: vakeel
      POSTGRES_DB: vakeel_saathi
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in filename order on first boot of an empty volume.
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vakeel -d vakeel_saathi']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
