# Render blueprint — https://render.com/docs/blueprint-spec
#
# Two services from ONE image, differing only in start command:
#
#   vakeel-web     -> node dist/main.js    (WhatsApp webhook, admin panel, health)
#   vakeel-worker  -> node dist/worker.js  (BullMQ consumer: RAG, eCourts, replies)
#
# Why split? Meta expects a webhook ack in well under a second and throttles - then
# disables - subscriptions that are slow. All slow work (retrieval, LLM calls,
# eCourts lookups) happens in the worker. One combined process would let a burst
# of AI calls stall webhook acks and take the bot off the air.
#
# ---------------------------------------------------------------------------
# Secrets use `sync: false`, which means "Render prompts for this, the value is
# never stored in the repo". Set them in the dashboard after first apply, or
# during the Blueprint creation flow.
# ---------------------------------------------------------------------------
#
# ⚠️ THIS FILE DESCRIBES THE INTENDED SHAPE, NOT NECESSARILY WHAT IS DEPLOYED
#
# The live service is currently a SINGLE web service running `npm run start:all`
# (scripts/start-all.js), which supervises both processes in one container. That
# is the cheaper shape and it is a supported one - but it is not what the
# blueprint below creates, so do not assume applying this file reproduces
# production. Two consequences of the single-container shape are worth knowing
# before choosing it:
#
#   1. HIBERNATION APPLIES TO THE WORKER TOO. On a plan that sleeps when idle,
#      the whole container sleeps - including the BullMQ consumer. Inbound
#      webhooks are still accepted and queued (the web process wakes to serve
#      them), but jobs already in the queue are not drained until something
#      wakes the container. The symptom is a reply that arrives minutes late,
#      or not until the next message. Fix: a paid always-on plan, or keep the
#      worker as its own service, which never sleeps.
#
#   2. COLD STARTS COUNT AGAINST THE WEBHOOK. Meta expects a fast ack and
#      throttles - then disables - slow subscriptions. A container waking from
#      hibernation can take several seconds on the first request.
#
# If you switch to the single-service shape permanently, replace the two
# services below with one web service whose dockerCommand is
# `npm run start:all`, and delete the worker block. Keep the env vars identical
# either way - start-all.js passes the whole environment to both children.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: vakeel-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/main.js
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # ---- Supabase -----------------------------------------------------
      # ⚠️ MUST be a POOLER url (aws-N-<region>.pooler.supabase.com), NOT the
      # direct db.<ref>.supabase.co host. See the note at the bottom of this
      # file - the direct host is IPv6-only and Render cannot reach it.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # ---- Redis --------------------------------------------------------
      - key: REDIS_URL
        sync: false

      # ---- Security -----------------------------------------------------
      # generateValue makes Render mint a random value once and keep it stable
      # across deploys. Do NOT use it for ENCRYPTION_KEY (see below).
      - key: JWT_SECRET
        generateValue: true
      # ⚠️ NEVER regenerate this. Rotating it makes every encrypted bar council
      # ID and every admin-panel secret permanently undecryptable. It must also
      # be exactly 64 hex characters, which generateValue does not guarantee -
      # hence sync: false and a value you generate once and keep.
      - key: ENCRYPTION_KEY
        sync: false

      # ---- WhatsApp -----------------------------------------------------
      # Only the verify token is needed at boot; the rest are pasted into the
      # admin panel at runtime (Settings -> WhatsApp connection).
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      # The number advocates message, in international format. Not the same
      # thing as WHATSAPP_PHONE_NUMBER_ID, which is an opaque Meta id. Shown on
      # the web app's account-linking screen.
      - key: WHATSAPP_DISPLAY_NUMBER
        sync: false

      # Set this to the service's own public URL after the first deploy.
      #
      # It does three jobs, which is why getting it wrong breaks unrelated
      # things: it is the webhook callback registered with Meta, the base for
      # the Google OAuth redirect URI, and the base for links in verification
      # and password-reset email. It also decides whether session cookies carry
      # the Secure attribute - an https value here and a plain-http origin means
      # browsers silently discard the cookie and sign-in appears to do nothing.
      - key: APP_PUBLIC_URL
        sync: false

      # ---- The advocate-facing web app ----------------------------------
      # Everything below is optional. Without them the web app still runs:
      # advocates sign up with email and password, ask questions and spend
      # credits. What each one adds is noted.

      # Adds the "Continue with Google" button. The Authorised redirect URI in
      # Google Cloud Console must equal APP_PUBLIC_URL + /auth/google/callback
      # exactly - a trailing slash is redirect_uri_mismatch.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

      # Adds email confirmation and password reset. Leave EMAIL_PROVIDER as
      # `log` and neither is offered - the UI says so rather than sending
      # someone to wait on an inbox for a message that was never sent.
      - key: EMAIL_PROVIDER
        value: log
      - key: RESEND_API_KEY
        sync: false

      # Payments are not implemented. Setting these only reveals the buy-credits
      # UI, so leave them empty until the gateway is actually wired up.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: vakeel-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # The worker needs the SAME values as the web service. Easiest path is a
      # Render environment group shared by both; otherwise re-enter them here.
      #
      # This matters more than it used to. Both processes now grant and spend
      # credits - the worker does it when answering WhatsApp messages - and the
      # daily allowance comes from QUOTA_GUEST_DAILY. If the two services
      # disagree on it, an advocate's free bucket is topped up to a different
      # number depending on which process happened to touch their account
      # first. Nothing errors; the balance simply moves on its own.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

# ---------------------------------------------------------------------------
# Redis / Key Value
#
# Render renamed "Redis" to "Key Value". Depending on your account's blueprint
# schema version, the service type below is either `redis` (older) or
# `keyvalue` (newer). If `render.yaml` is rejected on apply, delete this whole
# block, create the instance from the dashboard instead, and paste its internal
# connection string into REDIS_URL on both services.
#
# ⚠️ maxmemoryPolicy MUST be noeviction. BullMQ stores job state in Redis; any
# eviction policy silently discards queued jobs, and the symptom is "the bot
# received the message but never replied" with nothing in the logs.
# ---------------------------------------------------------------------------
  - type: redis
    name: vakeel-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []   # empty = internal network only, no public access

# ---------------------------------------------------------------------------
# ⚠️ THE SUPABASE IPv6 TRAP
#
# Supabase's DIRECT connection host:
#     db.<project-ref>.supabase.co:5432
# resolves to an IPv6 address only. Render's outbound networking is IPv4, so
# connecting to it fails with ENETUNREACH / ETIMEDOUT - after the environment
# variables are correct, which makes it look like a credentials problem.
#
# Use a POOLER connection string instead. In Supabase:
#   Project Settings -> Database -> Connection string -> pick a pooler tab
#
#   Transaction pooler, port 6543  -> DATABASE_URL   (best for the app: short
#                                     connections, survives container churn)
#   Session pooler,     port 5432  -> DIRECT_URL     (needed for migrations,
#                                     which use session-level features)
#
# Both look like:
#   postgresql://postgres.<ref>:<password>@aws-N-<region>.pooler.supabase.com:PORT/postgres
#
# Percent-encode the password: ? -> %3F   / -> %2F   : -> %3A   @ -> %40
# ---------------------------------------------------------------------------
